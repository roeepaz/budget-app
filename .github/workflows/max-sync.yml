name: MAX Credit Card Sync

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'max-sync/package-lock.json'

      - name: Install dependencies
        working-directory: max-sync
        run: npm ci

      - name: Install Playwright browsers
        working-directory: max-sync
        run: npx playwright install --with-deps chromium

      - name: Restore session cache
        uses: actions/cache@v4
        with:
          path: max-sync/.auth
          key: max-session-state

      - name: Run sync
        working-directory: max-sync
        env:
          MAX_USERNAME: ${{ secrets.MAX_USERNAME }}
          MAX_PASSWORD: ${{ secrets.MAX_PASSWORD }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          USER_ID: ${{ secrets.USER_ID }}
          HEADLESS: 'true'
        run: npm run build && npm start

      - name: Save session cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: max-sync/.auth
          key: max-session-state
