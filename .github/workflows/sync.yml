name: Credit Card Sync

on:
  schedule:
    # Runs daily at 02:05 UTC (05:05 AM Israel Summer Time / 04:05 AM Israel Winter Time).
    # Uses an off-peak minute (:05 instead of :00) to prevent GitHub Actions' multi-hour queue delays.
    - cron: '5 2 * * *'
  workflow_dispatch: {} # allows manual triggering from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: card-sync/package-lock.json

      - name: Install dependencies
        working-directory: card-sync
        run: npm install

      - name: Run sync
        working-directory: card-sync
        env:
          MAX_USERNAME: ${{ secrets.MAX_USERNAME }}
          MAX_PASSWORD: ${{ secrets.MAX_PASSWORD }}
          ISRACARD_ID: ${{ secrets.ISRACARD_ID }}
          ISRACARD_CARD_SUFFIX: ${{ secrets.ISRACARD_CARD_SUFFIX }}
          ISRACARD_PASSWORD: ${{ secrets.ISRACARD_PASSWORD }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          USER_ID: ${{ secrets.USER_ID }}
          HEADLESS: 'true'
          DEBUG: 'israeli-bank-scrapers:*'
        run: npm run build && npm start
